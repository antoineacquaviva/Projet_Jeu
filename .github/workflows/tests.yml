name: Tests

# Tests de la ligne active : le modèle « placement » (Python) et les maquettes jouables du kit et des pistes (JavaScript).
# Le moteur archivé (archive/moteur-foret/) n'est plus testé ici : voir archive/LISEZMOI.md pour le relancer à la main.

on:
  push:
    paths-ignore:
      - "archive/**"
      - "projet/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Installer pytest
        run: python -m pip install pytest
      - name: Tests du modèle placement
        run: python -m pytest -q tests

  maquettes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Version de Node (préinstallée sur l'image)
        run: node --version
      - name: Maquette du kit (rejoue les parties du moteur Python)
        run: node maquettes-numeriques/kit/test_moteur.js
      - name: Maquette des deux pistes
        run: node maquettes-numeriques/pistes/test_moteur.js
