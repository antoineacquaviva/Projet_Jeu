name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Installer pytest
        run: python -m pip install pytest
      - name: Conformité règles, code et tests
        run: python -m foret.conformite
      - name: Conformité des nœuds de l'atelier v2
        run: python -m foret.conformite --v2
      - name: Conformité des mesures de la batterie
        run: python -m foret.conformite --mesures
      - name: Tests
        run: python -m pytest -q tests
